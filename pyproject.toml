[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-analysis"
version = "0.1.0"
description = "A Python toolkit for standardizing the analysis of IntelliCage experiments."
readme = "README.md"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Fabrizio Musacchio" }]
keywords = [
  "IntelliCage",
  "behavior analysis",
  "place learning",
  "behavioral neuroscience",
  "mouse behavior",
  "reversal learning",
  "Python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "pyyaml",
  "scipy",
  "statsmodels"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  "myst-parser",
  "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/FabrizioMusacchio/ic-analysis"
Repository = "https://github.com/FabrizioMusacchio/ic-analysis"
Issues = "https://github.com/FabrizioMusacchio/ic-analysis/issues"
Changelog = "https://github.com/FabrizioMusacchio/ic-analysis/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ic_analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=ic_analysis",
  "--cov-report=term-missing",
  "--cov-fail-under=75"]
filterwarnings = [
  "ignore:scipy.stats.shapiro:UserWarning",
  "ignore:invalid value encountered in divide:RuntimeWarning",
  "ignore:divide by zero encountered in divide:RuntimeWarning",
  "ignore:Precision loss occurred in moment calculation.*:RuntimeWarning",
  "ignore:The behavior of wald_test will change after 0.14.*:FutureWarning"]

[tool.coverage.run]
branch = true
source = ["ic_analysis"]
omit = [
  "ic_analysis/workflows/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"]
