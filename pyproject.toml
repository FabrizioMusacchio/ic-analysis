[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ic-placelearning"
version = "0.0.1"
description = "A Python toolkit for analyzing place learning experiments conducted in the IntelliCage."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
  { name = "Fabrizio Musacchio" }]
keywords = [
  "IntelliCage",
  "place learning",
  "behavioral neuroscience",
  "mouse behavior",
  "reversal learning",
  "Python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics"]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "scipy",
  "statsmodels"]

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "sphinx",
  "sphinx-autodoc-typehints",
  "sphinx-rtd-theme",
  "myst-parser",
  "sphinx-copybutton"]

[project.urls]
Homepage = "https://github.com/FabrizioMusacchio/ic-placelearning"
Repository = "https://github.com/FabrizioMusacchio/ic-placelearning"
Issues = "https://github.com/FabrizioMusacchio/ic-placelearning/issues"
Changelog = "https://github.com/FabrizioMusacchio/ic-placelearning/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["ic_placelearning*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=ic_placelearning",
  "--cov-report=term-missing",
  "--cov-fail-under=75"]

[tool.coverage.run]
branch = true
source = ["ic_placelearning"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
  "raise NotImplementedError"]
